<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Rosary 긴급 데이터 보존</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f7f4ee;color:#26383b;padding:22px;max-width:700px;margin:auto}button{padding:16px;border-radius:12px;background:#225e72;color:white;border:0;font-size:17px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border-radius:10px}strong{color:#9b3a32}</style></head><body><h2>My Rosary 긴급 데이터 보존</h2><p><strong>기존 데이터를 수정·삭제하지 않습니다.</strong> 휴대전화에 남아 있는 기도 기록과 성화 파일을 JSON으로 내려받습니다. 다운로드 후 파일 크기가 0이 아닌지 확인하고 안전한 곳에 보관하세요.</p><button id="run">읽기 전용 데이터 내보내기</button><pre id="log">대기 중</pre><script>
const log=document.querySelector('#log'),button=document.querySelector('#run');function say(s){log.textContent+='\n'+s;}
function readAll(db,name){return new Promise((resolve,reject)=>{const tx=db.transaction(name,'readonly'),store=tx.objectStore(name),out=[];const req=store.openCursor();req.onsuccess=()=>{const c=req.result;if(c){out.push([c.key,c.value]);c.continue();}};req.onerror=()=>reject(req.error);tx.oncomplete=()=>resolve(out);tx.onabort=()=>reject(tx.error);});}
function base64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});}
async function normalize(x){if(x instanceof Blob)return {__rosary_blob:true,type:x.type,size:x.size,data:await base64(x)};if(Array.isArray(x))return Promise.all(x.map(normalize));if(x&&typeof x==='object'){const out={};for(const [k,v] of Object.entries(x))out[k]=await normalize(v);return out;}return x;}
button.onclick=async()=>{button.disabled=true;log.textContent='검사 시작';let db;try{if(indexedDB.databases){const dbs=await indexedDB.databases();if(!dbs.some(x=>x.name==='rosary-personal-book-v1'))throw Error('기존 데이터베이스가 목록에 없습니다. 새 데이터베이스를 만들지 않았습니다.');}db=await new Promise((resolve,reject)=>{const r=indexedDB.open('rosary-personal-book-v1');r.onupgradeneeded=()=>{r.transaction.abort();reject(Error('기존 DB가 없어 새 DB 생성이 감지되었습니다. 작업을 중단합니다.'));};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('저장소가 다른 창에 의해 잠겼습니다.'));});const names=[...db.objectStoreNames];say('저장 영역: '+names.join(', '));const stores={};for(const name of names){const rows=await readAll(db,name);say(name+': '+rows.length+'개 읽음');stores[name]=[];for(let i=0;i<rows.length;i++){stores[name].push([rows[i][0],await normalize(rows[i][1])]);if(i%5===0)log.textContent=log.textContent.replace(/\n처리 중.*$/,'')+'\n처리 중 '+name+' '+(i+1)+'/'+rows.length;}}const output={kind:'my-rosary-emergency-raw-idb-export',createdAt:new Date().toISOString(),origin:location.origin,dbName:db.name,dbVersion:db.version,stores};const blob=new Blob([JSON.stringify(output)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='My_Rosary_emergency_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();say('완료: '+(blob.size/1048576).toFixed(2)+'MB 파일 다운로드 요청됨');setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){say('오류: '+e.message);}finally{db?.close();button.disabled=false;}};
</script></body></html>
