<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#384e43">
<meta name="description" content="성화와 말씀, 기도문을 담는 나만의 묵주기도 기록장"><title>묵주기도 기입장</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="shell">
<header class="masthead"><a class="brand" href="./" aria-label="묵주기도 기입장 첫 화면"><span class="cross" aria-hidden="true">✝︎</span><div><h1>묵주기도 기입장</h1></div></a><div class="header-controls"><span id="connection" class="connection">기기 안에 보관</span></div></header>
<nav class="tabs" aria-label="주 메뉴"><button data-tab="calendar" aria-current="page">달력</button><button data-tab="mysteries">신비</button><button data-tab="prayers">기도문</button><button data-tab="appearance">꾸미기</button></nav>
<div id="error" class="notice error" role="alert" hidden></div>
<div id="update" class="notice" hidden>새 버전이 준비되었습니다. <button id="applyUpdate">업데이트 적용</button></div>
<div id="status" class="status" role="status" aria-live="polite">저장소를 여는 중…</div>
<main id="main" aria-busy="true"></main>
<section id="appearancePage" class="appearance-page" aria-labelledby="appearanceTitle" hidden><div class="section-heading"><div><h2 id="appearanceTitle">꾸미기</h2></div></div><div class="panel appearance-panel">
<div class="appearance-fields">
<label class="field">앱 이름<input id="appearanceName" type="text" maxlength="35" placeholder="묵주기도 기입장"></label>
<div class="field"><strong>로고</strong><div class="logo-options"><button type="button" id="chooseLogo">내 이미지 선택</button><button type="button" id="defaultLogo">기본 로고</button></div><input id="logoUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden><p class="muted">이미지를 선택하면 정사각형으로 위치와 크기를 조절할 수 있습니다.</p></div>
<div id="logoCropPanel" hidden><div class="actions crop-mode-actions"><button type="button" id="toggleCropMove" aria-pressed="false">위치 조절 시작</button><span class="muted" id="cropMoveHint">스크롤하려면 화면을 위아래로 밀어주세요.</span></div><div class="crop-viewport"><canvas id="logoCropCanvas" width="300" height="300" aria-label="로고 자르기 미리보기"></canvas></div><label class="field">확대·축소 <input id="logoZoom" type="range" min="1" max="3" value="1" step="0.01"></label><p class="muted">위치 조절을 켠 상태에서만 이미지를 움직일 수 있습니다.</p><div class="actions"><button type="button" id="saveCroppedLogo" class="primary">로고 저장</button><button type="button" id="cancelCrop">취소</button></div></div>
<div class="field"><strong>배경색</strong><div id="appearanceColors" class="appearance-colors"></div><label class="custom-color">직접 색상 선택 <input type="color" id="appearanceColorPicker" value="#f8f5ee"></label></div>
<label class="field">글씨체<select id="appearanceFont"><option value="default">기본 글씨체</option><option value="sans">고딕체</option><option value="serif">명조체</option><option value="round">둥근 글씨체</option><option value="nanumGothic">나눔고딕</option><option value="nanumMyeongjo">나눔명조</option><option value="batang">바탕체</option><option value="gulim">굴림체</option><option value="mono">고정폭 글씨체</option></select></label>
<p id="appearanceMessage" class="muted" role="status"></p><div class="dialog-actions"><button id="resetAppearance" type="button">기본 디자인으로</button></div></div></div></section>
<footer><details id="dataTools"><summary>데이터 · 백업</summary><div class="tools"><p>사진과 기록은 이 기기에 저장됩니다. 기기를 바꾸기 전에는 백업 파일을 보관해 주세요.</p><div class="actions"><button id="export">백업 내보내기</button><button id="import">백업 복원</button><button id="persist">저장 보호 요청</button><button id="checkUpdate">업데이트 확인</button><button id="install" hidden>앱 설치</button></div><p id="storageInfo" class="muted"></p><span class="version">개인 기도서 · 1.0.4 (배치 수정)</span></div></details></footer>
</div>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle"></h2><button type="button" id="closeEditor" class="quiet" aria-label="닫기">닫기</button></div><div id="editorBody"></div><div class="dialog-actions"><button type="button" id="cancelEditor">취소</button><button type="submit" class="primary" id="saveEditor">저장</button></div></form></dialog>
<dialog id="lightbox"><button id="closeLightbox" class="lightbox-close">닫기</button><div id="lightboxPosition" class="lightbox-position" aria-live="polite"></div><img alt="확대된 성화" id="largeArt"><div id="lightboxEmpty" class="lightbox-empty" hidden>등록된 성화가 없습니다</div><div class="lightbox-hint" aria-hidden="true">좌우로 밀어 성화 넘기기 · 두 손가락으로 확대</div></dialog>
<input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" hidden><input type="file" id="backupInput" accept=".json,application/json" hidden>
<noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
<script type="module" src="./settings.js"></script>
<script type="module" src="./app.js"></script>
</body></html>
