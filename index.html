<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#384e43">
<meta name="description" content="성화와 말씀, 기도문을 담는 나만의 묵주기도 기록장"><title>묵주기도 기입장</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="shell">
<header class="masthead"><a class="brand" href="./" aria-label="묵주기도 기입장 첫 화면"><span class="cross" aria-hidden="true">✝︎</span><div><span class="eyebrow">나의 작은 기도서</span><h1>묵주기도 기입장</h1></div></a><span id="connection" class="connection">기기 안에 보관</span></header>
<nav class="tabs" aria-label="주 메뉴"><button data-tab="calendar" aria-current="page">달력</button><button data-tab="mysteries">신비</button><button data-tab="prayers">기도문</button></nav>
<div id="error" class="notice error" role="alert" hidden></div>
<div id="update" class="notice" hidden>새 버전이 준비되었습니다. <button id="applyUpdate">업데이트 적용</button></div>
<div id="status" class="status" role="status" aria-live="polite">저장소를 여는 중…</div>
<main id="main" aria-busy="true"></main>
<footer><details id="dataTools"><summary>데이터 · 백업</summary><div class="tools"><p>사진과 기록은 이 기기에 저장됩니다. 기기를 바꾸기 전에는 백업 파일을 보관해 주세요.</p><div class="actions"><button id="export">백업 내보내기</button><button id="import">백업 복원</button><button id="persist">저장 보호 요청</button><button id="checkUpdate">업데이트 확인</button><button id="install" hidden>앱 설치</button></div><p id="storageInfo" class="muted"></p><span class="version">개인 기도서 · 1.0.4 (배치 수정)</span></div></details><div class="footer-line">매일의 기도, 한 장씩.</div></footer>
</div>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle"></h2><button type="button" id="closeEditor" class="quiet" aria-label="닫기">닫기</button></div><div id="editorBody"></div><div class="dialog-actions"><button type="button" id="cancelEditor">취소</button><button type="submit" class="primary" id="saveEditor">저장</button></div></form></dialog>
<dialog id="lightbox"><button id="closeLightbox" class="lightbox-close">닫기</button><img alt="확대된 성화" id="largeArt"></dialog>
<input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" hidden><input type="file" id="backupInput" accept=".json,application/json" hidden>
<noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
<script type="module" src="./app.js"></script>
</body></html>
