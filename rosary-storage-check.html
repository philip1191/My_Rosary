<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Rosary 저장소 읽기 전용 진단</title><style>body{font-family:system-ui,sans-serif;background:#f5f7f9;color:#263b43;margin:0;padding:22px;line-height:1.65}main{max-width:680px;margin:auto}h1{font-size:1.4rem}button{font:inherit;padding:12px 18px;border:1px solid #8ba5b0;border-radius:10px;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d7e0e4;padding:15px;border-radius:12px}small{color:#52646a}</style></head><body><main><h1>My Rosary 저장소 진단</h1><p>이 페이지는 기존 앱 코드를 실행하지 않고 <strong>읽기 전용</strong>으로 데이터베이스와 저장 항목의 존재 여부만 확인합니다. 저장·삭제·복원은 하지 않습니다.</p><p><strong>반드시 My Rosary와 같은 GitHub Pages 주소에서 열어야 합니다.</strong></p><button id="run">저장소 검사 시작</button><pre id="out">검사 전</pre><small>검사 결과에는 기록 내용, 기도문 본문, 사진이 표시되지 않습니다. 결과 화면을 캡처해 보내 주세요. 앱 데이터·사이트 데이터는 지우지 마세요.</small></main><script>
const out=document.getElementById('out');const lines=[];const say=s=>{lines.push(s);out.textContent=lines.join('\n')};
function timeout(p,ms=9000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('응답 대기 시간 초과')),ms))])}
function readKeys(db,storeName){return timeout(new Promise((resolve,reject)=>{let tx;try{tx=db.transaction(storeName,'readonly');const st=tx.objectStore(storeName);const req=st.getAllKeys();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.onerror=()=>reject(tx.error)}catch(e){reject(e)}}))}
function readValue(db,storeName,key){return timeout(new Promise((resolve,reject)=>{try{const req=db.transaction(storeName,'readonly').objectStore(storeName).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}catch(e){reject(e)}}))}
function summary(v){if(v===undefined)return '없음';if(v===null)return 'null';if(typeof v!=='object')return '자료 유형: '+typeof v;const r=[];if(v.records&&typeof v.records==='object')r.push('기도 기록 날짜 수: '+Object.keys(v.records).length);if(v.decades&&typeof v.decades==='object'){const ds=Object.values(v.decades);r.push('신비 단 수: '+ds.length);r.push('성화 연결된 단 수: '+ds.filter(x=>x&&x.art).length);r.push('말씀 입력된 단 수: '+ds.filter(x=>x&&x.scripture).length)}if(Array.isArray(v.prayers))r.push('등록 기도문 수: '+v.prayers.length);r.push('객체 항목 수: '+Object.keys(v).length);return r.join(' / ')}
document.getElementById('run').onclick=async e=>{e.currentTarget.disabled=true;lines.length=0;say('주소: '+location.origin+location.pathname);say('검사 시각: '+new Date().toLocaleString('ko-KR'));let db;try{if(!('indexedDB'in window))throw Error('IndexedDB 미지원');if(typeof indexedDB.databases!=='function'){say('이 브라우저는 데이터베이스 목록 조회를 지원하지 않습니다. 새 DB 생성 위험을 피하기 위해 중단합니다.');return}const dbs=await timeout(indexedDB.databases());const names=dbs.map(x=>x.name);say('확인된 DB 수: '+names.length);const target='rosary-personal-book-v1';say('My Rosary DB 존재: '+(names.includes(target)?'예':'아니오'));if(!names.includes(target)){say('현재 주소의 저장소에 해당 DB가 없습니다. 다른 브라우저/주소인지 확인하세요.');return}db=await timeout(new Promise((resolve,reject)=>{const req=indexedDB.open(target);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('다른 탭이 DB 열기를 차단 중'))}));const stores=Array.from(db.objectStoreNames);say('저장 영역: '+stores.join(', '));if(stores.includes('state')){const keys=await readKeys(db,'state');say('state 키: '+keys.map(String).join(', '));for(const key of ['current','previous']){if(keys.includes(key)){const v=await readValue(db,'state',key);say(key+': '+summary(v))}else say(key+': 키 없음')}}if(stores.includes('assets')){const keys=await readKeys(db,'assets');say('성화 assets 저장 항목 수: '+keys.length)}say('검사 완료 (데이터 변경 없음)')}catch(err){say('검사 오류: '+(err?.name||'Error')+' — '+(err?.message||String(err)))}finally{if(db)db.close();e.currentTarget.disabled=false}};
</script></body></html>
